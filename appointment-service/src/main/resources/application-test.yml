spring:
  datasource:
    url: jdbc:h2:mem:appointmentdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  # Tests use a simple in-memory cache and no Eureka/Redis.
  cache:
    type: simple

eureka:
  client:
    enabled: false
