# Self-contained demo: in-memory H2, simple cache, no Eureka. Run with --spring.profiles.active=demo
spring:
  datasource:
    url: jdbc:h2:mem:appointmentdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cache:
    type: simple
  h2:
    console:
      enabled: true

eureka:
  client:
    enabled: false

# identity-service is not running in the demo, so booking uses the resilience fail-open path.
medicare:
  identity:
    url: http://localhost:9
resilience4j:
  retry:
    instances:
      identity:
        max-attempts: 2
        wait-duration: 50ms
