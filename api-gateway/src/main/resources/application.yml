spring:
  application:
    name: api-gateway
  profiles:
    default: dev
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            key-resolver: "#{@ipKeyResolver}"
      routes:
        - id: identity-service
          uri: ${IDENTITY_URI:http://localhost:8081}
          predicates:
            - Path=/identity/**
          filters:
            - StripPrefix=1
        - id: appointment-service
          uri: ${APPOINTMENT_URI:http://localhost:8082}
          predicates:
            - Path=/appointments/**
          filters:
            - StripPrefix=1
        - id: medical-records-service
          uri: ${RECORDS_URI:http://localhost:8083}
          predicates:
            - Path=/records/**
          filters:
            - StripPrefix=1
        - id: web-ui
          uri: ${WEB_UI_URI:http://localhost:8090}
          predicates:
            - Path=/**

server:
  port: 8080

medicare:
  jwt:
    secret: ${JWT_SECRET:MedicareDevSecretKeyMustBeAtLeast32Chars!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
