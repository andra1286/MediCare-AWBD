spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
  cloud:
    gateway:
      default-filters: []
      routes:
        - id: identity-service
          uri: http://localhost:8081
          predicates:
            - Path=/identity/**
          filters:
            - StripPrefix=1

eureka:
  client:
    enabled: false

medicare:
  jwt:
    secret: MedicareTestSecretKeyMustBeAtLeast32Chars!!
    expiration-ms: 3600000
