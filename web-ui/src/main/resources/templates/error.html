<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Error - MediCare')}"></head>
<body>
<div class="mc-auth-bg p-3">
    <div class="card mc-auth-card border-0 text-center">
        <div class="card-body p-5">
            <i class="bi bi-clipboard2-x" style="font-size:3.5rem;color:#0d9488;"></i>
            <h1 class="display-4 fw-bold mt-2 mb-0" th:text="${status} ?: 'Error'">Error</h1>
            <p class="lead mb-4" th:switch="${status}">
                <span th:case="404">The page you are looking for does not exist.</span>
                <span th:case="403">You don't have permission to access this page.</span>
                <span th:case="500">Something went wrong on our side. Please try again later.</span>
                <span th:case="*" th:text="${error} ?: 'Unexpected error.'">Unexpected error.</span>
            </p>
            <a class="btn btn-primary btn-lg" th:href="@{/}"><i class="bi bi-house"></i> Back to dashboard</a>
        </div>
    </div>
</div>
</body>
</html>
