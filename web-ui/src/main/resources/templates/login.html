<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Login - MediCare')}"></head>
<body class="bg-light">
<div class="container" style="max-width: 420px; margin-top: 8%;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="card-title text-center mb-4">🏥 MediCare Login</h3>

            <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
            <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control" id="username" name="username" required autofocus/>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" id="password" name="password" type="password" required/>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" id="remember-me" name="remember-me" type="checkbox"/>
                    <label class="form-check-label" for="remember-me">Remember me</label>
                </div>
                <button class="btn btn-primary w-100" type="submit">Sign in</button>
            </form>

            <p class="text-muted small mt-3 mb-0">
                Demo users: <code>admin/admin</code>, <code>doctor/doctor</code>, <code>patient/patient</code>
            </p>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/fragments :: scripts}"></th:block>
</body>
</html>
