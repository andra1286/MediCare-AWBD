<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/fragments :: head('Medications - MediCare')}"></head>
<body>
<nav th:replace="~{fragments/fragments :: navbar}"></nav>
<div th:replace="~{fragments/fragments :: alerts}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Medication catalog</h2>
        <a sec:authorize="hasRole('ADMIN')" class="btn btn-success" th:href="@{/medications/new}">+ New medication</a>
    </div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>#</th>
            <th><a th:href="@{/medications(sort='name,asc',size=${size})}">Name</a></th>
            <th>Dosage form</th>
            <th><a th:href="@{/medications(sort='atcCode,asc',size=${size})}">ATC code</a></th>
            <th sec:authorize="hasRole('ADMIN')">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${page.content}">
            <td th:text="${m.id}"></td>
            <td th:text="${m.name}"></td>
            <td th:text="${m.dosageForm}"></td>
            <td th:text="${m.atcCode}"></td>
            <td sec:authorize="hasRole('ADMIN')">
                <a class="btn btn-sm btn-outline-primary" th:href="@{'/medications/' + ${m.id} + '/edit'}">Edit</a>
                <form th:action="@{'/medications/' + ${m.id} + '/delete'}" method="post" class="d-inline"
                      onsubmit="return confirm('Delete this medication?');">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${page.content.isEmpty()}">
            <td colspan="5" class="text-center text-muted">No medications yet.</td>
        </tr>
        </tbody>
    </table>

    <nav th:replace="~{fragments/fragments :: pagination(${page}, '/medications', ${sort}, ${size})}"></nav>
</div>
<th:block th:replace="~{fragments/fragments :: scripts}"></th:block>
</body>
</html>
