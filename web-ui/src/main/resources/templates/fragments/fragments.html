<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title}">MediCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link href="/css/app.css" rel="stylesheet"/>
</head>
<body>

<!-- ===== Navbar ===== -->
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg mc-navbar sticky-top mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}"><i class="bi bi-heart-pulse-fill"></i> MediCare</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'appointments'} ? 'active'"
                       th:href="@{/appointments}"><i class="bi bi-calendar2-check"></i> Appointments</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'records'} ? 'active'"
                       th:href="@{/records}"><i class="bi bi-file-medical"></i> Medical Records</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'medications'} ? 'active'"
                       th:href="@{/medications}"><i class="bi bi-capsule"></i> Medications</a>
                </li>
            </ul>
            <span class="mc-userchip me-3">
                <i class="bi bi-person-circle"></i>
                <span sec:authentication="name">user</span>
            </span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-secondary btn-sm" type="submit">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<!-- ===== Flash alerts ===== -->
<div th:fragment="alerts" class="container">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show d-flex align-items-center" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- ===== Pagination ===== -->
<nav th:fragment="pagination(page, base, sort, size)"
     th:if="${page != null and page.totalPages > 1}" aria-label="pages" class="mt-3">
    <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${page.page == 0} ? 'disabled'">
            <a class="page-link" th:href="@{${base}(page=${page.page - 1},size=${size},sort=${sort})}">
                <i class="bi bi-chevron-left"></i></a>
        </li>
        <li class="page-item disabled">
            <span class="page-link" th:text="'Page ' + (${page.page} + 1) + ' / ' + ${page.totalPages}">Page</span>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:href="@{${base}(page=${page.page + 1},size=${size},sort=${sort})}">
                <i class="bi bi-chevron-right"></i></a>
        </li>
    </ul>
</nav>

<!-- ===== Scripts ===== -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
