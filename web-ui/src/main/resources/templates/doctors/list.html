<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/fragments :: head('Doctors - MediCare')}"></head>
<body>
<nav th:replace="~{fragments/fragments :: navbar('doctors')}"></nav>
<div th:replace="~{fragments/fragments :: alerts}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h2 class="mc-page-title mb-0"><i class="bi bi-person-badge text-primary"></i> Doctors</h2>
            <span class="mc-page-sub">Profiles linked to user accounts</span>
        </div>
        <a class="btn btn-primary" th:href="@{/doctors/new}">
            <i class="bi bi-plus-lg"></i> New doctor profile</a>
    </div>

    <div th:if="${page.content.isEmpty()}" class="empty-state mc-card">
        <i class="bi bi-person-badge d-block"></i>
        <p class="mt-2 mb-0">No doctor profiles yet.</p>
    </div>

    <div class="table-responsive mc-card" th:if="${!page.content.isEmpty()}">
        <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Specialty</th>
                <th>License</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="d : ${page.content}">
                <td th:text="${d.id}">1</td>
                <td th:text="${d.fullName}">Name</td>
                <td th:text="${d.specialty}">Specialty</td>
                <td th:text="${d.licenseNo}">DOC-001</td>
                <td class="text-end">
                    <form th:action="@{'/doctors/' + ${d.id} + '/delete'}" method="post"
                          onsubmit="return confirm('Delete this doctor profile?');" class="d-inline">
                        <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:replace="~{fragments/fragments :: pagination(${page}, '/doctors', ${sort}, ${size})}"></nav>
</div>
<th:block th:replace="~{fragments/fragments :: scripts}"></th:block>
</body>
</html>
