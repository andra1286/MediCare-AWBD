<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('New record - MediCare')}"></head>
<body>
<nav th:replace="~{fragments/fragments :: navbar('records')}"></nav>
<div th:replace="~{fragments/fragments :: alerts}"></div>

<div class="container" style="max-width: 720px;">
    <h2 class="mc-page-title mb-1"><i class="bi bi-file-earmark-medical text-primary"></i> New medical record</h2>
    <p class="mc-page-sub mb-4">Document a completed consultation and optionally add a prescription.</p>

    <div class="mc-card p-4">
    <form th:action="@{/records}" th:object="${medicalRecordForm}" method="post" novalidate>
        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label" for="appointmentId">Appointment ID</label>
                <input class="form-control" id="appointmentId" type="number" min="1"
                       th:field="*{appointmentId}" required
                       th:classappend="${#fields.hasErrors('appointmentId')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('appointmentId')}"
                     th:errors="*{appointmentId}"></div>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label" for="doctorId">Doctor ID</label>
                <input class="form-control" id="doctorId" type="number" min="1"
                       th:field="*{doctorId}" required
                       th:classappend="${#fields.hasErrors('doctorId')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('doctorId')}"
                     th:errors="*{doctorId}"></div>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label" for="patientId">Patient ID</label>
                <input class="form-control" id="patientId" type="number" min="1"
                       th:field="*{patientId}" required
                       th:classappend="${#fields.hasErrors('patientId')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('patientId')}"
                     th:errors="*{patientId}"></div>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="diagnosis">Diagnosis</label>
            <input class="form-control" id="diagnosis" th:field="*{diagnosis}" required maxlength="1000"
                   th:classappend="${#fields.hasErrors('diagnosis')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('diagnosis')}" th:errors="*{diagnosis}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="notes">Notes</label>
            <textarea class="form-control" id="notes" th:field="*{notes}" rows="2" maxlength="2000"></textarea>
        </div>

        <hr/>
        <h5>Prescription (optional)</h5>
        <div class="mb-3">
            <label class="form-label" for="medicationIds">Medications</label>
            <select class="form-select" id="medicationIds" th:field="*{medicationIds}" multiple size="5">
                <option th:each="m : ${medications}" th:value="${m.id}"
                        th:text="${m.name + (m.dosageForm != null ? ' (' + m.dosageForm + ')' : '')}"></option>
            </select>
            <div class="form-text">Hold Ctrl/Cmd to select multiple. Leave empty for no prescription.</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="prescriptionInstructions">Instructions</label>
            <input class="form-control" id="prescriptionInstructions"
                   th:field="*{prescriptionInstructions}" maxlength="500"
                   placeholder="e.g. One tablet twice a day after meals"/>
        </div>

        <button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Create record</button>
        <a class="btn btn-light" th:href="@{/records}">Cancel</a>
    </form>
    </div>
</div>
<th:block th:replace="~{fragments/fragments :: scripts}"></th:block>
</body>
</html>
