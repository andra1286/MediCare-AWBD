<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Medical records - MediCare')}"></head>
<body>
<nav th:replace="~{fragments/fragments :: navbar}"></nav>
<div th:replace="~{fragments/fragments :: alerts}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Medical records</h2>
        <a class="btn btn-success" th:href="@{/records/new}">+ New record</a>
    </div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>#</th>
            <th>Appointment</th>
            <th>Doctor</th>
            <th>Patient</th>
            <th><a th:href="@{/records(sort='diagnosis,asc',size=${size})}">Diagnosis</a></th>
            <th><a th:href="@{/records(sort='createdAt,desc',size=${size})}">Created ▼</a></th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${page.content}">
            <td th:text="${r.id}"></td>
            <td th:text="${r.appointmentId}"></td>
            <td th:text="${r.doctorId}"></td>
            <td th:text="${r.patientId}"></td>
            <td th:text="${r.diagnosis}"></td>
            <td th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td><a class="btn btn-sm btn-outline-primary" th:href="@{'/records/' + ${r.id}}">View</a></td>
        </tr>
        <tr th:if="${page.content.isEmpty()}">
            <td colspan="7" class="text-center text-muted">No medical records yet.</td>
        </tr>
        </tbody>
    </table>

    <nav th:replace="~{fragments/fragments :: pagination(${page}, '/records', ${sort}, ${size})}"></nav>
</div>
<th:block th:replace="~{fragments/fragments :: scripts}"></th:block>
</body>
</html>
