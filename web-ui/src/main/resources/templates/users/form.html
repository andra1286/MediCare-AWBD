<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('User - MediCare')}"></head>
<body>
<nav th:replace="~{fragments/fragments :: navbar('users')}"></nav>
<div th:replace="~{fragments/fragments :: alerts}"></div>

<div class="container" style="max-width: 640px;">
    <h2 class="mc-page-title mb-4">
        <i class="bi bi-shield-lock text-primary"></i>
        <span th:text="${editId != null} ? 'Edit user' : 'New user'">User</span>
    </h2>

    <div class="mc-card p-4">
    <form th:object="${userForm}" method="post" novalidate
          th:action="${editId != null} ? @{'/users/' + ${editId}} : @{/users}">
        <div class="mb-3" th:if="${editId == null}">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" th:field="*{username}" required maxlength="50"
                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
        </div>
        <div class="mb-3" th:if="${editId != null}">
            <label class="form-label">Username</label>
            <input class="form-control" th:value="*{username}" readonly/>
        </div>
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" type="email" th:field="*{email}" required
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3" th:if="${editId == null}">
            <label class="form-label" for="fullName">Full name</label>
            <input class="form-control" id="fullName" th:field="*{fullName}" required maxlength="120"
                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
        </div>
        <div class="mb-3" th:if="${editId != null}">
            <label class="form-label" for="fullNameEdit">Full name</label>
            <input class="form-control" id="fullNameEdit" th:field="*{fullName}" maxlength="120"/>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" type="password" th:field="*{password}"
                   th:placeholder="${editId != null} ? 'Leave blank to keep current' : ''"
                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="mb-3" th:if="${editId != null}">
            <div class="form-check">
                <input class="form-check-input" id="enabled" type="checkbox" th:field="*{enabled}"/>
                <label class="form-check-label" for="enabled">Account enabled</label>
            </div>
        </div>
        <fieldset class="mb-3">
            <legend class="form-label fs-6">Roles</legend>
            <div class="form-check" th:each="role : ${ {'ROLE_ADMIN','ROLE_DOCTOR','ROLE_PATIENT'} }">
                <input class="form-check-input" type="checkbox" th:field="*{roles}" th:value="${role}"
                       th:id="${'role-' + role}"/>
                <label class="form-check-label" th:for="${'role-' + role}" th:text="${role}">Role</label>
            </div>
        </fieldset>
        <button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Save</button>
        <a class="btn btn-light" th:href="@{/users}">Cancel</a>
    </form>
    </div>
</div>
<th:block th:replace="~{fragments/fragments :: scripts}"></th:block>
</body>
</html>
