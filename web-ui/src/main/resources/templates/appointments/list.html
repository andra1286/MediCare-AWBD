<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head('Appointments - MediCare')}"></head>
<body>
<nav th:replace="~{fragments/fragments :: navbar}"></nav>
<div th:replace="~{fragments/fragments :: alerts}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Appointments</h2>
        <a class="btn btn-success" th:href="@{/appointments/new}">+ Book appointment</a>
    </div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>#</th>
            <th>Doctor</th>
            <th>Patient</th>
            <th><a th:href="@{/appointments(sort='scheduledAt,asc',size=${size})}">Scheduled ▲</a>
                / <a th:href="@{/appointments(sort='scheduledAt,desc',size=${size})}">▼</a></th>
            <th><a th:href="@{/appointments(sort='status,asc',size=${size})}">Status</a></th>
            <th>Reason</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${page.content}">
            <td th:text="${a.id}"></td>
            <td th:text="${a.doctorId}"></td>
            <td th:text="${a.patientId}"></td>
            <td th:text="${#temporals.format(a.scheduledAt, 'yyyy-MM-dd HH:mm')}"></td>
            <td><span class="badge bg-secondary" th:text="${a.status}"></span></td>
            <td th:text="${a.reason}"></td>
            <td th:if="${a.status == 'BOOKED'}">
                <form th:action="@{'/appointments/' + ${a.id} + '/complete'}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-outline-success" type="submit">Complete</button>
                </form>
                <form th:action="@{'/appointments/' + ${a.id} + '/cancel'}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Cancel</button>
                </form>
            </td>
            <td th:unless="${a.status == 'BOOKED'}"><span class="text-muted">—</span></td>
        </tr>
        <tr th:if="${page.content.isEmpty()}">
            <td colspan="7" class="text-center text-muted">No appointments yet.</td>
        </tr>
        </tbody>
    </table>

    <nav th:replace="~{fragments/fragments :: pagination(${page}, '/appointments', ${sort}, ${size})}"></nav>
</div>
<th:block th:replace="~{fragments/fragments :: scripts}"></th:block>
</body>
</html>
