spring:
  datasource:
    url: jdbc:h2:mem:recordsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  cache:
    type: simple

eureka:
  client:
    enabled: false

# Unreachable appointment-service URL so Feign fails fast and the resilience fallback is exercised.
medicare:
  appointment:
    url: http://localhost:9
  identity:
    url: http://localhost:9

resilience4j:
  retry:
    instances:
      appointment:
        max-attempts: 2
        wait-duration: 10ms
