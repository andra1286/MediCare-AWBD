spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medicare_records}
    username: ${DB_USER:medicare}
    password: ${DB_PASSWORD:medicare}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Direct URLs for dev (Feign uses these when set; otherwise Eureka lb). Wired in Phase 3.
medicare:
  identity:
    url: ${IDENTITY_URL:}
  appointment:
    url: ${APPOINTMENT_URL:}
