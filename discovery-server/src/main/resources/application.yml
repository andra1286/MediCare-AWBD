spring:
  application:
    name: discovery-server

server:
  port: 8761

# Standalone registry: this node does not register with or fetch from another Eureka cluster.
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
